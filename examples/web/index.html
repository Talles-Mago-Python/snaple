<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>snaple — viewer</title>
    <!-- favicon embutido só para o navegador não pedir /favicon.ico e sujar o console -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231b1d21'/%3E%3Cpath d='M3 10.5 8 13l5-2.5M3 8 8 10.5 13 8M8 3 3 5.5 8 8l5-2.5z' fill='none' stroke='%239c6b45' stroke-width='1.2' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100dvh;
        display: grid;
        grid-template-rows: 1fr auto;
        background: #1b1d21;
        color: #d7dbe0;
        font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #palco { display: block; width: 100%; height: 100%; }
      #rodape {
        border-top: 1px solid #33383f;
        background: #16181b;
        padding: 12px 16px;
        max-height: 34dvh;
        overflow: auto;
      }
      #painel { margin: 0; white-space: pre-wrap; }
      #painel.com-aviso { color: #ffc46b; }
      #dica { margin: 8px 0 0; color: #6b7480; }
      @media (min-width: 900px) {
        body { grid-template-rows: none; grid-template-columns: 1fr 26rem; }
        #rodape { border-top: 0; border-left: 1px solid #33383f; max-height: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="palco"></canvas>
    <div id="rodape">
      <pre id="painel">carregando…</pre>
      <p id="dica">
        botão esquerdo orbita · botão direito faz pan · scroll dá zoom<br />
        edite <code>examples/web/cena.ts</code> e salve — a cena remonta sozinha
      </p>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
